<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%" style="background-color: #050b1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816" />
      <stop offset="50%" stop-color="#071225" />
      <stop offset="100%" stop-color="#020611" />
    </linearGradient>

    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d4dff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="split-team" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23345d" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .pulse {
      animation: pulse-anim 4s infinite ease-in-out;
    }
    .scanner {
      animation: scan-anim 6s infinite ease-in-out;
    }
    .float {
      animation: float-anim 5s infinite ease-in-out;
    }
    .glitch-1 {
      animation: glitch-anim-1 8s infinite linear;
    }
    .glitch-2 {
      animation: glitch-anim-2 8s infinite linear;
    }
    .star-twinkle {
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes pulse-anim {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 3px #8b5cf6); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #8b5cf6) drop-shadow(0 0 18px #3b82f6); }
    }
    @keyframes scan-anim {
      0% { transform: translateY(-10px); opacity: 0; }
      5% { opacity: 0.8; }
      45% { opacity: 0.8; }
      50% { transform: translateY(270px); opacity: 0; }
      100% { transform: translateY(270px); opacity: 0; }
    }
    @keyframes float-anim {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.2); }
    }
    @keyframes glitch-anim-1 {
      0%, 95%, 100% { transform: translate(0); }
      96% { transform: translate(-2px, 1px); }
      97% { transform: translate(2px, -1px); }
      98% { transform: translate(-1px, -2px); }
      99% { transform: translate(1px, 2px); }
    }
    @keyframes glitch-anim-2 {
      0%, 95%, 100% { transform: translate(0); }
      96% { transform: translate(1px, -2px); }
      97% { transform: translate(-1px, 2px); }
      98% { transform: translate(2px, 1px); }
      99% { transform: translate(-2px, -1px); }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="260" fill="url(#bg-grad)" />
  <rect width="800" height="260" fill="url(#grid)" />
  <rect width="800" height="260" fill="url(#dot-grid)" />

  <!-- Diagonal cyber lines -->
  <path d="M-100 260 L300 -50" stroke="url(#violet-grad)" stroke-width="1.5" opacity="0.35" />
  <path d="M0 260 L400 -50" stroke="url(#violet-grad)" stroke-width="1" opacity="0.25" />
  <path d="M500 310 L900 0" stroke="url(#violet-grad)" stroke-width="1" opacity="0.2" />

  <!-- Cybersecurity code text -->
  <g opacity="0.24" font-family="Courier New, monospace" font-size="10" fill="#8b5cf6">
    <text x="30" y="40">SOC_MODE: ACTIVE</text>
    <text x="30" y="60">THREAT_LEVEL: ELEVATED</text>
    <text x="30" y="80">BLUE_TEAM.DEFEND()</text>
    <text x="30" y="100">RED_TEAM.SIMULATE_ATTACK()</text>

    <text x="535" y="180">LOG_TRACE: /var/secure/ops.log</text>
    <text x="535" y="200">TARGET_SCOPE: INTERNAL_NETWORK</text>
    <text x="535" y="220">THREAT_HUNT: TRUE</text>
    <text x="535" y="240">STATUS: MONITORING...</text>
  </g>

  <!-- Twinkling particles -->
  <g fill="#a855f7">
    <circle cx="120" cy="180" r="1.5" class="star-twinkle" style="animation-delay: 0.5s;" />
    <circle cx="280" cy="50" r="2" class="star-twinkle" style="animation-delay: 1.2s;" />
    <circle cx="450" cy="220" r="1" class="star-twinkle" style="animation-delay: 0.1s;" />
    <circle cx="500" cy="40" r="2.5" class="star-twinkle" style="animation-delay: 2s;" />
    <circle cx="700" cy="90" r="1.5" class="star-twinkle" style="animation-delay: 0.8s;" />
  </g>

  <g fill="#3b82f6">
    <circle cx="180" cy="210" r="1.5" class="star-twinkle" style="animation-delay: 1.5s;" />
    <circle cx="380" cy="30" r="1" class="star-twinkle" style="animation-delay: 0.3s;" />
    <circle cx="620" cy="60" r="2" class="star-twinkle" style="animation-delay: 2.2s;" />
    <circle cx="720" cy="170" r="1.5" class="star-twinkle" style="animation-delay: 0.9s;" />
  </g>

  <g fill="#ef4444">
    <circle cx="150" cy="100" r="1" class="star-twinkle" style="animation-delay: 1.7s;" />
    <circle cx="670" cy="210" r="1.8" class="star-twinkle" style="animation-delay: 1.1s;" />
  </g>

  <!-- Background glow blobs -->
  <circle cx="400" cy="130" r="120" fill="#8b5cf6" opacity="0.14" filter="url(#glow-violet)" />
  <circle cx="280" cy="110" r="90" fill="#3b82f6" opacity="0.10" filter="url(#glow-blue)" />
  <circle cx="530" cy="145" r="90" fill="#ef4444" opacity="0.08" filter="url(#glow-red)" />

  <!-- Scanner -->
  <g class="scanner">
    <rect x="0" y="0" width="800" height="4" fill="url(#laser-grad)" filter="url(#glow-violet)" />
  </g>

  <!-- Central Cyber Shield Icon -->
  <g transform="translate(400, 82) scale(0.8)" class="float">
    <!-- Shield outline -->
    <path d="M 0,-45 L 42,-28 L 38,15 C 36,42 18,60 0,72 C -18,60 -36,42 -38,15 L -42,-28 Z"
          fill="none" stroke="url(#split-team)" stroke-width="3.5" filter="url(#glow-violet)" />

    <!-- Inner lock -->
    <rect x="-12" y="0" width="24" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.9" />
    <path d="M -7,0 L -7,-10 C -7,-18 7,-18 7,-10 L 7,0" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.9" />

    <!-- Terminal / code line -->
    <path d="M -22,-18 L -10,-10 L -22,-2" fill="none" stroke="#3b82f6" stroke-width="2.4" filter="url(#glow-blue)" />
    <line x1="-4" y1="-2" x2="18" y2="-2" stroke="#a855f7" stroke-width="2.4" filter="url(#glow-violet)" />

    <!-- Left blue team mark -->
    <circle cx="-26" cy="26" r="3" fill="#3b82f6" filter="url(#glow-blue)" />
    <line x1="-20" y1="26" x2="-8" y2="26" stroke="#3b82f6" stroke-width="2" />

    <!-- Right red team mark -->
    <circle cx="26" cy="26" r="3" fill="#ef4444" filter="url(#glow-red)" />
    <line x1="8" y1="26" x2="20" y2="26" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Main Title -->
  <g class="glitch-1">
    <text x="400" y="170" text-anchor="middle" font-size="22" font-weight="900" letter-spacing="1.5" fill="#ffffff" filter="url(#glow-violet)" class="pulse">
      There is no patch for human stupidity
    </text>
  </g>

  <g class="glitch-2" opacity="0.85">
    <text x="398" y="171" text-anchor="middle" font-size="22" font-weight="900" letter-spacing="1.5" fill="#ef4444" opacity="0.45" style="mix-blend-mode: screen;">
      There is no patch for human stupidity
    </text>
  </g>

  <g class="glitch-1" opacity="0.85">
    <text x="402" y="169" text-anchor="middle" font-size="22" font-weight="900" letter-spacing="1.5" fill="#3b82f6" opacity="0.45" style="mix-blend-mode: screen;">
      There is no patch for human stupidity
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="205" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="3" fill="#a855f7" opacity="0.95" font-family="'Courier New', monospace">
    // DEFENDING SYSTEMS • SIMULATING ATTACKS • SECURING DIGITAL INFRASTRUCTURE
  </text>

  <!-- Border -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-subtle)" />
  <path d="M 785 35 L 785 15 L 765 15" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-subtle)" />
  <path d="M 15 225 L 15 245 L 35 245" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-subtle)" />
  <path d="M 785 225 L 785 245 L 765 245" fill="none" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-subtle)" />

  <line x1="45" y1="15" x2="755" y2="15" stroke="#23345d" stroke-width="1" opacity="0.6" />
  <line x1="45" y1="245" x2="755" y2="245" stroke="#23345d" stroke-width="1" opacity="0.6" />
  <line x1="15" y1="45" x2="15" y2="215" stroke="#23345d" stroke-width="1" opacity="0.6" />
  <line x1="785" y1="45" x2="785" y2="215" stroke="#23345d" stroke-width="1" opacity="0.6" />
</svg>
